name: Build Custom Image on PR Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build-custom-image:
    if: github.event.pull_request.merged == true
    name: Package App and Build Custom Image
    runs-on: ubuntu-latest
    environment: development

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      # Application Variables
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

      # AWS Packer Variables
      PKR_VAR_aws_region: ${{ secrets.AWS_REGION}}
      PKR_VAR_aws_instance_type: ${{ secrets.AWS_INSTANCE_TYPE}}
      PKR_VAR_aws_subnet_id: ${{ secrets.AWS_SUBNET_ID}}
      PKR_VAR_aws_volume_size: ${{ secrets.AWS_VOLUME_SIZE }}
      PKR_VAR_aws_volume_type: ${{ secrets.AWS_VOLUME_TYPE }}
      PKR_VAR_aws_ami_user: ${{ secrets.AWS_AMI_USER }}

      # Common Variables
      PKR_VAR_ssh_user: ${{ secrets.SSH_USERNAME }}

    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DATABASE_PASSWORD}}
          MYSQL_DATABASE: ${{ secrets.DATABASE_NAME}}
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: AWS CLI installation
        uses: unfor19/install-aws-cli-action@v1

      - name: AWS CLI credentials configuration
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Package Application
        run: mvn clean -B package

      - name: Packer Installation
        uses: hashicorp/setup-packer@main

      - name: Packer Initialization
        working-directory: packer
        run: packer init .

      - name: Check packer format
        working-directory: packer
        run: packer fmt -check .

      - name: Validate packer
        working-directory: packer
        run: packer validate .

      - name: Packer Image Build
        working-directory: packer
        run: packer build .