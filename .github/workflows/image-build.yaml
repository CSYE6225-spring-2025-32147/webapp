name: Build Custom Image on PR Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build-custom-image:
    if: github.event.pull_request.merged == true
    name: Package App and Build Custom Image
    runs-on: ubuntu-latest
    environment: development

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      PKR_VAR_aws_region: ${{ secrets.AWS_REGION }}
      PKR_VAR_aws_instance_type: ${{ secrets.AWS_INSTANCE_TYPE }}
      PKR_VAR_aws_subnet_id: ${{ secrets.AWS_SUBNET_ID }}
      PKR_VAR_aws_volume_size: ${{ secrets.AWS_VOLUME_SIZE }}
      PKR_VAR_aws_volume_type: ${{ secrets.AWS_VOLUME_TYPE }}
      PKR_VAR_aws_ami_user: ${{ secrets.AWS_AMI_USER }}
      PKR_VAR_ssh_user: ${{ secrets.SSH_USERNAME }}

    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DATABASE_NAME }}
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: AWS CLI installation
        uses: unfor19/install-aws-cli-action@v1

      - name: AWS CLI credentials configuration
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Package Application
        run: mvn clean -B package

      - name: Packer Installation
        uses: hashicorp/setup-packer@main

      - name: Packer Initialization
        working-directory: packer
        run: packer init .

      - name: Check packer format
        working-directory: packer
        run: packer fmt -check .

      - name: Validate packer
        working-directory: packer
        run: packer validate .

      - name: Packer Image Build
        working-directory: packer
        run: packer build .

      - name: Switch to DEMO AWS account
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_DEMO_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_DEMO_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Launch Template and Instance Refresh
        run: |
          
          # Fetch latest AMI ID matching naming convention
          AMI_ID=$(aws ec2 describe-images \
            --filters "Name=name,Values=csye6225*" \
            --query "Images | sort_by(@, &CreationDate) | [-1].ImageId" \
            --output text)

          echo "Latest AMI ID: $AMI_ID"

          # Get the latest launch template version
          LATEST_VERSION=$(aws ec2 describe-launch-template-versions \
            --launch-template-id "${{ secrets.LT_ID }}" \
            --query "LaunchTemplateVersions | sort_by(@, &VersionNumber) | [-1].VersionNumber" \
            --output text)

          echo "Creating version $LATEST_VERSION  of launch template"

          aws ec2 create-launch-template-version \
            --launch-template-id "${{ secrets.LT_ID }}" \
            --source-version "$LATEST_VERSION" \
            --launch-template-data "{\"ImageId\":\"$AMI_ID\"}"

          echo "Starting instance refresh on Auto Scaling Group: ${{ secrets.ASGRP_NAME }}"

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ secrets.ASGRP_NAME }}" \
            --strategy Rolling

          echo "Waiting for instance refresh to complete..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ secrets.ASGRP_NAME }}" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Current refresh status: $STATUS"

            case "$STATUS" in
              Successful)
                echo "Instance refresh completed."
                break
                ;;
              Failed | Cancelled | Cancelling)
                echo "Instance refresh failed or was cancelled."
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
