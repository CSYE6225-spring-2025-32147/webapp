name: Build Custom Image on PR Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build-custom-image:
    if: github.event.pull_request.merged == true
    name: Package App and Build Custom Image
    runs-on: ubuntu-latest
    environment: development

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Application Variables
      database_url: ${{ secrets.DB_URL }}
      database_username: ${{ secrets.DB_USRNAME }}
      database_passwordd: ${{ secrets.DB_PASSWORD }}

      # AWS Packer Variables
      PKR_VAR_aws_region: ${{ secrets.AWS_REGION}}
      PKR_VAR_aws_instance_type: ${{ secrets.INSTANCE_TYPE}}
      PKR_VAR_aws_subnet_id: ${{ secrets.SUBNET_ID}}
      PKR_VAR_aws_volume_size: ${{ secrets.VOLUME_SIZE }}
      PKR_VAR_aws_volume_type: ${{ secrets.VOLUME_TYPE }}
      PKR_VAR_aws_ami_user: ${{ secrets.AMI_USER }}

      # Common Variables
      PKR_VAR_database_url: ${{ secrets.DB_URL }}
      PKR_VAR_database_username: ${{ secrets.DB_USRNAME }}
      PKR_VAR_database_password: ${{ secrets.DB_PASSWORD }}
      PKR_VAR_database_name: ${{ secrets.DB_DATABASE }}
      PKR_VAR_ssh_user: ${{ secrets.SSH_USERNAME }}

    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD}}
          MYSQL_DATABASE: ${{ secrets.DB_DATABASE}}
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set Up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Package Application
        run: mvn clean -B package

      - name: Install Packer
        uses: hashicorp/setup-packer@main

      - name: Install Packer Google Cloud Plugin
        run: packer plugins install github.com/hashicorp/googlecompute

      - name: Initialize Packer
        working-directory: packer
        run: packer init .

      - name: Run Packer fmt Check
        working-directory: packer
        run: packer fmt -check .

      - name: Run Packer Validation
        working-directory: packer
        run: packer validate .

      - name: Build Packer Image
        working-directory: packer
        run: packer build .