name: CI - Run Tests and Validate Packer

on:
  pull_request:
    branches:
      - main

jobs:
  test-development:
    name: Run Application Tests and Validate Packer
    runs-on: ubuntu-latest
    environment: development

    env:
      # Application Variables
      DB_URL: ${{ secrets.DB_URL }}
      DB_USRNAME: ${{ secrets.DB_USRNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # Packer Variables (Automatically Picked Up)
      PKR_VAR_database_url: ${{ secrets.DB_URL }}
      PKR_VAR_database_username: ${{ secrets.DB_USRNAME }}
      PKR_VAR_database_password: ${{ secrets.DB_PASSWORD }}
      PKR_VAR_database_name: ${{ secrets.DB_DATABASE }}
      PKR_VAR_aws_volume_sze: ${{ secrets.VOLUME_SIZE }}
      PKR_VAR_aws_volume_type: ${{ secrets.VOLUME_TYPE }}
      PKR_VAR_ssh_user: ${{ secrets.SSH_USERNAME }}
      PKR_VAR_aws_subnet_id: ${{ secrets.SUBNET_ID }}
      PKR_VAR_aws_instance_type: ${{ secrets.INSTANCE_TYPE }}
      PKR_VAR_aws_region: ${{ secrets.REGION }}
      PKR_VAR_aws_ami_user: ${{ secrets.AMI_USER }}


    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_DATABASE }}
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies and Run Tests
        run: mvn clean -B package

      - name: Install Packer
        uses: hashicorp/setup-packer@main

      - name: Initialize Packer
        working-directory: packer
        run: packer init .

      - name: Validate packer formatting
        working-directory: packer
        run: packer fmt -check .

      - name: Run Packer Validation
        working-directory: packer
        run: packer validate .