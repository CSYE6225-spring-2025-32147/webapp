name: CI - Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test-development:
    name: Run Application Tests
    runs-on: ubuntu-latest
    environment: development  # Use the 'development' environment

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up JDK 17
      - name: Set Up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Set up dependencies and run Maven build (including tests)
      - name: Set Up Dependencies and Run Tests
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USRNAME: ${{ secrets.DB_USRNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PRT_NBR: ${{ secrets.PRT_NBR }}
        run: mvn clean install  # This will run tests as part of the build